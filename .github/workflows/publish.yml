name: publish

# Monorepo mycolegal-shared: publica a GitHub Packages TODOS los paquetes de
# `packages/`. Cada uno se publica SOLO si su versión aún no existe en el
# registry → un push a main publica únicamente el paquete cuya versión se ha
# bumpeado. Sustituye a los dos publish.yml separados de los repos
# mycolegal-ui / mycolegal-sharedlib.
#
# ⚠️ LA MATRIZ SE DESCUBRE, NO SE ESCRIBE A MANO, Y ES POR UN FALLO CONCRETO
# (3-oct-2026). Estaba escrita como `pkg: [ui, sharedlib, text-extract]`, y al
# añadir `docfilling-core` al monorepo nadie la tocó. Resultado: el push subió
# el paquete, Actions corrió **tres** jobs, el workflow salió en VERDE —porque
# no falló nada: simplemente no existía el cuarto job— y `publish-package.sh` se
# quedó esperando diez veces un paquete que nunca se iba a publicar.
#
# Y el detalle que lo hacía indetectable: `publish-package.sh` sólo hace `git
# add packages/<pkg>`, así que un arreglo de ESTE fichero no viaja con el
# publish — hay que pushearlo aparte. Descubriéndola, no hay nada que recordar.
#
# Ver [[feedback_paquete_shared_nuevo_cableado_en_5_sitios]].

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish.yml'

permissions:
  contents: read
  packages: write

jobs:
  # Descubre los paquetes publicables: todo `packages/*` con package.json y sin
  # `"private": true`. Un paquete nuevo entra en la matriz por existir.
  descubrir:
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.listar.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v4
      - id: listar
        run: |
          set -euo pipefail
          PKGS=$(for d in packages/*/; do
            [ -f "$d/package.json" ] || continue
            node -e "process.exit(require('./$d/package.json').private === true ? 1 : 0)" || continue
            basename "$d"
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "pkgs=$PKGS" >> "$GITHUB_OUTPUT"
          echo "paquetes publicables: $PKGS"

  publish:
    needs: descubrir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.descubrir.outputs.pkgs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@mycolegal-app'

      # ⚠️ `npm ci` EXIGE QUE EL LOCKFILE DE LA RAÍZ CONOZCA TODOS LOS WORKSPACES.
      #
      # Al añadir `packages/ai-core` sin correr `npm install` en la raíz, este
      # paso murió con «Missing: @mycolegal-app/ai-core@0.1.0 from lock file»…
      # y al ser el PRIMER paso, tumbó **los cinco jobs**, no sólo el del
      # paquete nuevo (3-oct-2026). Un paquete sin lockear no retrasa su propia
      # publicación: impide la de todos.
      #
      # Al crear un paquete: `npm install --package-lock-only` en la raíz del
      # monorepo y commitear el `package-lock.json` con él.
      - name: Install workspace (deps para el build de prepublishOnly)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.pkg }} si la versión es nueva
        working-directory: packages/${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "· $NAME@$VER ya está publicado — nada que hacer."
          else
            echo "· Publicando $NAME@$VER …"
            # npm publish ejecuta prepublishOnly (en ui: build:e2e = tsc) automáticamente
            npm publish
            echo "· Publicado $NAME@$VER ✅"
          fi
